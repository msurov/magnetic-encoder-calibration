[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "magnetic-encoder-calib"
version = "0.1.0"
description = "Project for magnetic encoder calibration"
requires-python = ">=3.12"

dependencies = [
  "numpy>=2.2.2",
  "scipy>=1.15.1" ,
  "matplotlib>=3.10.0",
]

[tool.setuptools]
py-modules = ["undistort_encoder_signal", "calibrate_encoder"]
